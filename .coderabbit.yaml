# CONFIGEDGE R6 — boolean-typed-as-string, three-way discriminator
# (authorized CodeRabbit VDP; marker configedge_)
# reviews.auto_review.enabled is documented boolean; sent as the STRING "false",
# paired with description_keyword that is deliberately NOT in the PR title/body.
#   branch A: key rejected at validation      -> default enabled=true -> RUN + warning listed
#   branch B: accepted as-is, treated truthy  -> RUN + NO warning for `enabled`
#   branch C: accepted and parsed to false    -> keyword absent -> SKIPPED (status only, no comment)
# Controls: profile=assertive, list-form path_filters exclusion.
reviews:
  profile: assertive
  path_filters:
    - "!configedge_payload.py"
  auto_review:
    enabled: "false"
    auto_pause_after_reviewed_commits: 0
    description_keyword: "configedge_triggerword_absent"
