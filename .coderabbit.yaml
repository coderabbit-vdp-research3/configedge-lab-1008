# CONFIGEDGE R2 — ENUM / NUMBER / STRING near-miss confusion (authorized CodeRabbit VDP; marker configedge_)
# - language: near-miss enum ("en_US" vs documented "en-US")
# - profile control kept VALID (assertive) + valid list-form path_filters control
# - pre_merge_checks.docstrings.mode: NUMBER where enum-string expected
# - pre_merge_checks.docstrings.threshold: STRING where number expected
# - tone_instructions: LIST where STRING expected (the "vice versa" cell)
language: "en_US"
tone_instructions:
  - "configedge_list_where_string_a"
  - "configedge_list_where_string_b"
reviews:
  profile: assertive
  path_filters:
    - "!configedge_payload.py"
  auto_review:
    enabled: true
    # harness control (valid key, identical in every cell): disable the
    # default 5-reviewed-commit auto-pause so every cell can run
    auto_pause_after_reviewed_commits: 0
  pre_merge_checks:
    docstrings:
      mode: 2
      threshold: "80"
