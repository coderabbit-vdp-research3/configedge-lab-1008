# CONFIGEDGE R5 — YAML DUPLICATE KEYS (authorized CodeRabbit VDP; marker configedge_)
# Two keys declared twice at the same mapping level, values typed-opposite in effect:
#   profile: assertive  (first)   vs  profile: quiet  (second)
#   path_filters: ["!configedge_payload.py"] (first, EXCLUDE payload)
#              vs path_filters: ["configedge_payload.py"] (second, INCLUDE payload)
# Which value the SERVER applies is directly observable:
#   banner "Review profile: ASSERTIVE|QUIET"  +  "Files selected for processing".
# Common YAML parsers (PyYAML, js-yaml) are last-wins; a strict parser errors.
reviews:
  profile: assertive
  path_filters:
    - "!configedge_payload.py"
  profile: quiet
  path_filters:
    - "configedge_payload.py"
  auto_review:
    enabled: true
    # harness control (valid key, identical in every cell): disable the
    # default 5-reviewed-commit auto-pause so every cell can run
    auto_pause_after_reviewed_commits: 0
