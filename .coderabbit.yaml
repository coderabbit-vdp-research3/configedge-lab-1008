# CONFIGEDGE R12 — VALID VARIANT on the SECOND commit of PR#2 (authorized CodeRabbit VDP)
# Byte-identical to R8 except `reviews.profile: quiet` (was assertive).
# Purpose: separate "a repo config that merely CHANGES between commits is still read"
# (expected: banner "Review profile: QUIET" + our file path) from the Alt-10 hypothesis
# that only the FIRST commit's config is ever honoured. Without this cell a later
# fallback on R9 would be ambiguous (type error vs "modified config ignored").
reviews:
  profile: quiet
  path_filters:
    - "!configedge_payload.py"
  auto_review:
    enabled: true
    auto_pause_after_reviewed_commits: 0
