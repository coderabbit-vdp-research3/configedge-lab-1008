# CONFIGEDGE R3 — UNION wrong-branch confusion (authorized CodeRabbit VDP; marker configedge_)
# knowledge_base.code_guidelines.filePatterns[] is the only union key in schema.v2:
#   anyOf [ string | object{files,applyTo required} ]
# Both wrong branches are sent: a NUMBER where the union is expected, and an
# object missing its required second member.
# Controls: profile=assertive, list-form path_filters exclusion, no other bad keys.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - 123
      - files: "configedge_agents_placeholder.md"
reviews:
  profile: assertive
  path_filters:
    - "!configedge_payload.py"
  auto_review:
    enabled: true
    # harness control (valid key, identical in every cell): disable the
    # default 5-reviewed-commit auto-pause so every cell can run
    auto_pause_after_reviewed_commits: 0
